name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run verify
      - name: Capture risk-engine hot-path benchmark evidence
        run: npm run benchmark:risk
      - name: Capture quick HTTP load and event-loop evidence
        env:
          CRIX_BENCH_API_KEY: "ci-benchmark-${{ github.run_id }}"
        run: npm run benchmark:http:quick

  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install governance and research-adapter test dependencies
        run: pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "scipy>=1.14,<2"
      - name: Run CRIX model-governance tests
        run: python -m unittest discover -s model -p 'test_*.py' -v
      - name: Capture Batch B portfolio benchmark evidence
        run: python model/benchmark_portfolio.py --quick
      - name: Capture Batch B synthetic tail validation
        run: python model/validate_tail_models.py
