name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run verify
      - name: Capture risk-engine hot-path benchmark evidence
        run: npm run benchmark:risk
      - name: Capture quick HTTP load and event-loop evidence
        env:
          CRIX_BENCH_API_KEY: "ci-benchmark-${{ github.run_id }}"
        run: npm run benchmark:http:quick

  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.lock
      - name: Install governed Python environment
        run: python -m pip install --require-hashes -r model/requirements.lock
      - name: Run CRIX model-governance tests
        run: python -m unittest discover -s model -p 'test_*.py' -v
      - name: Verify committed training lineage read-only
        run: |
          python model/lineage.py verify \
            model/lineage/crix-monoboost-v2.training-run.json \
            --root . \
            --expected-git-commit 007e8f2be0fb51c2487fb13db35c642a20f1ded7 \
            --expected-data-contract-version crix-lendingclub-harmonized-v1
          git diff --exit-code -- model/lineage
      - name: Capture Batch B portfolio benchmark evidence
        run: python model/benchmark_portfolio.py --quick
      - name: Capture Batch B synthetic tail validation
        run: python model/validate_tail_models.py


  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reproduce Node dependency graph from lock
        run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Verify dependency lock provenance
        run: npm run verify:locks
      - name: Audit live Node production dependencies
        run: npm run audit:node
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Python audit tool
        run: python -m pip install "pip-audit==2.10.1"
      - name: Capture offline research dependency audit evidence
        id: python-audit
        continue-on-error: true
        run: pip-audit -r model/requirements.lock --require-hashes --format=json --output=pip-audit.json
      - name: Explain Python audit policy
        if: always()
        run: |
          echo "Python model/research advisories are evidence for explicit reachability/environment triage."
          echo "They do not silently retrain/promote the champion and are not treated as live Fastify exposure by default."
          echo "pip-audit outcome: ${{ steps.python-audit.outcome }}"
      - name: Upload Python audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crix-python-dependency-audit-${{ github.run_id }}
          path: pip-audit.json
          if-no-files-found: warn
