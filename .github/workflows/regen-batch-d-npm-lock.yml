name: Regenerate Batch D npm lock

on:
  push:
    branches:
      - hardening/batch-d-runtime-observability-supply-chain
    paths:
      - package.json
      - .github/workflows/regen-batch-d-npm-lock.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(deps): refresh npm lock"
          git push origin HEAD:"${GITHUB_REF_NAME}"
