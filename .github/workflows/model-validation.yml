name: Model validation

on:
  pull_request:
    paths:
      - "model/**"
      - ".github/workflows/model-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Restore immutable LendingClub source cache
        uses: actions/cache@v4
        with:
          path: model/data/LC_loans_granting_model_dataset.csv
          key: crix-lendingclub-b019384d6bc65bf2a3e839362e4ff502
      - name: Install model dependencies
        run: pip install -r model/requirements.txt
      - name: Train real-data champion/challenger with governance gates
        run: python model/train.py
      - name: Publish champion manifest and registry index
        run: python model/publish_champion_manifest.py
      - name: Verify generated artifact carries governance and integrity evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "model")
          from registry import verify_manifest

          artifact_path = Path("model/artifacts/crix-monoboost-v2.json")
          manifest_path = Path("model/artifacts/crix-monoboost-v2.manifest.json")
          artifact = json.loads(artifact_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          registry = json.loads(Path("model/artifacts/registry.json").read_text())
          governance = artifact["training"]["governance"]
          assert governance["populationConditioning"] == "granted-loans-only"
          assert governance["rejectInference"]["supported"] is False
          assert len(governance["featureProvenance"]) == len(artifact["featureNames"])
          assert set(governance["uncertainty"]) == {"auc", "brier", "logLoss", "ks"}
          assert governance["policyBacktests"]["approveAll"]["selectedCount"] == artifact["metrics"]["testSamples"]
          assert "not a 12-month PD" in artifact["target"]["horizon"]
          assert verify_manifest(artifact_path, manifest)
          assert manifest["modelId"] == "CRIX-MonoBoost@2.0.0"
          assert registry["models"]["CRIX-MonoBoost@2.0.0"]["artifactSha256"] == manifest["artifactSha256"]
          print("CRIX model-governance and registry artifact gate passed")
          print("CRIX_RUNTIME_MANIFEST=" + json.dumps(manifest, sort_keys=True, separators=(",", ":")))
          print("CRIX_REGISTRY_INDEX=" + json.dumps(registry, sort_keys=True, separators=(",", ":")))
          PY
      - name: Upload registry evidence
        uses: actions/upload-artifact@v4
        with:
          name: crix-champion-registry-${{ github.run_id }}
          path: |
            model/artifacts/crix-monoboost-v2.manifest.json
            model/artifacts/registry.json
          if-no-files-found: error
