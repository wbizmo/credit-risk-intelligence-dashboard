name: Model validation

on:
  pull_request:
    paths:
      - "model/**"
      - ".github/workflows/model-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CRIX_TRAINING_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CRIX_TRAINING_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Restore immutable LendingClub granting source cache
        uses: actions/cache@v4
        with:
          path: model/data/LC_loans_granting_model_dataset.csv
          key: crix-lendingclub-b019384d6bc65bf2a3e839362e4ff502
      - name: Restore immutable LendingClub lifecycle research source cache
        uses: actions/cache@v4
        with:
          path: model/data/loan_data_2007_2014.csv
          key: crix-lifecycle-43ecf2dcf074c87215078f33019c1282d9edb0d3569ce052d5ad6a597004c545
      - name: Restore public UNRATE research snapshot
        uses: actions/cache@v4
        with:
          path: model/public_data/UNRATE_2006_2014.csv
          key: crix-fred-unrate-revised-2006-2014-v1
      - name: Install model dependencies
        run: pip install -r model/requirements.txt
      - name: Run fast model invariant suite under full environment
        run: python -m unittest discover -s model -p 'test_*.py' -v
      - name: Preserve deployed champion bytes
        run: cp model/artifacts/crix-monoboost-v2.json /tmp/crix-monoboost-v2.committed.json
      - name: Train real-data champion/challenger with governance gates
        run: python model/train.py
      - name: Validate retrain against deployed champion and restore deployed bytes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          deployed = json.loads(Path("/tmp/crix-monoboost-v2.committed.json").read_text())
          retrained = json.loads(Path("model/artifacts/crix-monoboost-v2.json").read_text())

          for key in ("name", "version", "target", "featureNames", "monotoneConstraints"):
              assert retrained[key] == deployed[key], key

          assert retrained["metrics"]["testSamples"] == deployed["metrics"]["testSamples"]
          tolerances = {
              "auc": 1e-4,
              "brier": 1e-4,
              "logLoss": 1e-4,
              "ks": 1e-4,
              "challengerAuc": 1e-4,
              "defaultRate": 1e-9,
          }
          deltas = {}
          for key, tolerance in tolerances.items():
              delta = abs(float(retrained["metrics"][key]) - float(deployed["metrics"][key]))
              assert delta <= tolerance, (key, delta, tolerance)
              deltas[key] = delta

          governance = retrained["training"]["governance"]
          assert governance["populationConditioning"] == "granted-loans-only"
          assert governance["rejectInference"]["supported"] is False
          assert len(governance["featureProvenance"]) == len(retrained["featureNames"])
          assert set(governance["uncertainty"]) == {"auc", "brier", "logLoss", "ks"}
          assert governance["policyBacktests"]["approveAll"]["selectedCount"] == retrained["metrics"]["testSamples"]
          print("CRIX deployed-champion retrain validation passed", deltas)
          PY
          cp /tmp/crix-monoboost-v2.committed.json model/artifacts/crix-monoboost-v2.json
      - name: Publish deployed champion manifest and registry index
        run: python model/publish_champion_manifest.py
      - name: Validate point-in-time research risk stack without rebinding immutable versions
        run: |
          python model/research_validation.py prepare --workspace /tmp/crix-risk-stack-validation
          python /tmp/crix-risk-stack-validation/model/train_risk_stack.py --no-download
          python model/research_validation.py compare \
            --generated /tmp/crix-risk-stack-validation/model/artifacts \
            --report model/artifacts/research-retrain-validation.json
      - name: Generate integrated roadmap 20-24 research evidence
        run: python model/train_advanced_risk.py
      - name: Verify advanced-risk evidence and accounting/capital separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("model/artifacts/crix-advanced-risk-v1.json").read_text())
          macro = artifact["macro"]
          portfolio = artifact["portfolio"]
          capital = artifact["capital"]
          decision = artifact["decisioning"]
          ifrs9 = artifact["ifrs9Style"]

          assert artifact["version"] == "1.0.0" and artifact["status"] == "research"
          assert macro["driver"] == "UNRATE" and macro["causalityClaim"] is False
          assert macro["sourceSha256"] and "revised historical" in macro["seriesSemantics"]
          assert macro["metrics"]["trainSamples"] > 2_000 and macro["metrics"]["ootSamples"] > 2_000
          assert portfolio["baseline"]["scenarios"] >= 100_000
          assert portfolio["baseline"]["tailSupport"]["0.999"]["supported"] is True
          assert portfolio["baseline"]["var"]["0.999"] is not None
          assert capital["economic"]["economicCapital"] >= 0
          assert capital["irbStyleAggregateCapital"] >= 0 and capital["irbStyleAggregateRwa"] >= 0
          assert ifrs9["stage2"]["ecl"] >= ifrs9["stage1"]["ecl"] - 1e-10
          assert decision["result"]["status"] == "optimal"
          for key in ("exposure", "expectedLoss", "expectedReturn"):
              assert abs(decision["independentRevalidation"][key] - decision["result"][key]) < 1e-8, key
          assert artifact["runtimeContract"].startswith("/api/v3")
          assert Path("model/ADVANCED_RISK_REPORT.md").is_file()
          assert Path("model/public_data/UNRATE_2006_2014.csv").is_file()
          print("CRIX roadmap 20-24 integrated research evidence gate passed")
          PY
      - name: Verify published artifacts carry governance and integrity evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "model")
          from registry import verify_manifest

          artifact_dir = Path("model/artifacts")
          champion_path = artifact_dir / "crix-monoboost-v2.json"
          champion_manifest_path = artifact_dir / "crix-monoboost-v2.manifest.json"
          champion = json.loads(champion_path.read_text())
          champion_manifest = json.loads(champion_manifest_path.read_text())
          registry = json.loads((artifact_dir / "registry.json").read_text())
          assert "not a 12-month PD" in champion["target"]["horizon"]
          assert champion["trainedAt"] == "2026-09-08"
          assert verify_manifest(champion_path, champion_manifest)
          assert champion_manifest["trainedAt"] == champion["trainedAt"]
          assert champion_manifest["trainingRunId"] == os.environ["CRIX_TRAINING_RUN_ID"]
          assert champion_manifest["gitCommit"] == os.environ["CRIX_TRAINING_GIT_SHA"]

          expected = {
              "CRIX-MonoBoost@2.0.0": "crix-monoboost-v2",
              "CRIX-LifetimePD@1.0.0": "crix-lifetime-pd-v1",
              "CRIX-Transitions-Taiwan@1.0.0": "crix-transitions-taiwan-v1",
              "CRIX-EAD-Installment@1.0.0": "crix-ead-installment-v1",
              "CRIX-CCF-Taiwan@1.0.0": "crix-ccf-taiwan-v1",
              "CRIX-LGD@1.0.0": "crix-lgd-v1",
          }
          assert set(expected).issubset(registry["models"])
          for model_id, stem in expected.items():
              entry = registry["models"][model_id]
              artifact_path = Path(entry["artifact"])
              manifest_path = Path(entry["manifest"])
              manifest = json.loads(manifest_path.read_text())
              assert verify_manifest(artifact_path, manifest), model_id
              assert manifest["artifactSha256"] == entry["artifactSha256"]
              if model_id == "CRIX-MonoBoost@2.0.0":
                  assert manifest["trainingRunId"] == os.environ["CRIX_TRAINING_RUN_ID"]
                  assert manifest["gitCommit"] == os.environ["CRIX_TRAINING_GIT_SHA"]
              else:
                  assert manifest["status"] == "research"
                  assert manifest["trainingRunId"]
                  assert manifest["gitCommit"]

          survival = json.loads((artifact_dir / "crix-lifetime-pd-v1.json").read_text())
          assert survival["target"]["maxHorizonMonths"] == 36
          assert survival["target"]["censoring"]
          assert "interest" not in " ".join(survival["model"]["featureNames"]).lower()

          transitions = json.loads((artifact_dir / "crix-transitions-taiwan-v1.json").read_text())
          for row in transitions["matrix"]:
              assert abs(sum(row) - 1.0) < 1e-10
          assert transitions["nonDefaultOctoberState"] == "not-fabricated"

          ead = json.loads((artifact_dir / "crix-ead-installment-v1.json").read_text())
          lgd = json.loads((artifact_dir / "crix-lgd-v1.json").read_text())
          ccf = json.loads((artifact_dir / "crix-ccf-taiwan-v1.json").read_text())
          assert "remains unchanged" in ead["v3RuntimeBaseline"]
          assert lgd["discountRate"] == 0.0 and "aggregate-only" in lgd["recoveryTimingSupport"]
          assert "not pure draw CCF" in ccf["warning"]
          assert (artifact_dir / "snapshot-v3-retrospective.json").is_file()
          assert (artifact_dir / "research-retrain-validation.json").is_file()
          assert Path("model/RISK_STACK_REPORT.md").is_file()

          print("CRIX full model-governance, immutable registry and research retrain gate passed")
          print("CRIX_RUNTIME_MANIFEST=" + json.dumps(champion_manifest, sort_keys=True, separators=(",", ":")))
          print("CRIX_REGISTRY_INDEX=" + json.dumps(registry, sort_keys=True, separators=(",", ":")))
          PY
      - name: Upload full risk-stack evidence
        uses: actions/upload-artifact@v4
        with:
          name: crix-risk-stack-${{ github.run_id }}
          path: |
            model/artifacts/crix-monoboost-v2.json
            model/artifacts/*.manifest.json
            model/artifacts/registry.json
            model/artifacts/research-retrain-validation.json
            model/artifacts/crix-lifetime-pd-v1.json
            model/artifacts/crix-transitions-taiwan-v1.json
            model/artifacts/crix-ead-installment-v1.json
            model/artifacts/crix-ccf-taiwan-v1.json
            model/artifacts/crix-lgd-v1.json
            model/artifacts/crix-advanced-risk-v1.json
            model/artifacts/snapshot-*.json
            model/public_data/UNRATE_2006_2014.csv
            model/TRAINING_REPORT.md
            model/RISK_STACK_REPORT.md
            model/ADVANCED_RISK_REPORT.md
          if-no-files-found: error
