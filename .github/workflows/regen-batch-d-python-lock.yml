name: Regenerate Batch D Python lock

on:
  push:
    branches:
      - hardening/batch-d-runtime-observability-supply-chain
    paths:
      - model/requirements.txt
      - .github/workflows/regen-batch-d-python-lock.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "pip-tools==7.6.1"
      - run: pip-compile --generate-hashes --resolver=backtracking model/requirements.txt -o model/requirements.lock
      - name: Refresh lock metadata and lineage digest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          def digest(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          meta={
            "schemaVersion":1,
            "python":"3.12",
            "generator":"pip-tools==7.6.1",
            "requirementsSha256":digest("model/requirements.txt"),
            "lockSha256":digest("model/requirements.lock"),
          }
          Path("model/requirements.lock.meta.json").write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")
          lineage_path=Path("model/lineage/crix-monoboost-v2.training-run.json")
          lineage=json.loads(lineage_path.read_text())
          lineage["dependencyLock"]["sha256"]=meta["lockSha256"]
          lineage_path.write_text(json.dumps(lineage,indent=2)+"\n")
          PY
      - name: Commit refreshed governed environment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/requirements.lock model/requirements.lock.meta.json model/lineage/crix-monoboost-v2.training-run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(deps): refresh governed Python lock"
          git push origin HEAD:"${GITHUB_REF_NAME}"
