name: Sync API-version lineage evidence

on:
  push:
    branches:
      - fix/api-version-3.2.0
    paths:
      - MODEL_CARD.md
      - .github/workflows/sync-api-version-lineage.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Refresh MODEL_CARD lineage digest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path=Path('model/lineage/crix-monoboost-v2.training-run.json')
          manifest=json.loads(path.read_text())
          digest=hashlib.sha256(Path('MODEL_CARD.md').read_bytes()).hexdigest()
          for item in manifest['evidence']:
              if item['path']=='MODEL_CARD.md':
                  item['sha256']=digest
                  break
          else:
              raise SystemExit('MODEL_CARD.md lineage entry missing')
          path.write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Commit synchronized lineage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/lineage/crix-monoboost-v2.training-run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "governance(lineage): sync API-version model-card digest"
          git push origin HEAD:"${GITHUB_REF_NAME}"
