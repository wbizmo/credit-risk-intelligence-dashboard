# Temporary Batch D lock generator; removed after locks are committed.
name: Generate Batch D dependency locks

on:
  push:
    branches:
      - hardening/batch-d-runtime-observability-supply-chain
    paths:
      - package.json
      - model/requirements.txt
      - .github/workflows/generate-batch-d-locks.yml

permissions:
  contents: write

concurrency:
  group: batch-d-lock-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate hash-pinned Python research lock
        run: |
          python -m pip install --disable-pip-version-check "pip-tools==7.6.1"
          pip-compile --generate-hashes --allow-unsafe --resolver=backtracking model/requirements.txt -o model/requirements.lock
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def digest(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          metadata = {
              "schemaVersion": 1,
              "python": "3.12",
              "generator": "pip-tools==7.6.1",
              "requirementsSha256": digest("model/requirements.txt"),
              "lockSha256": digest("model/requirements.lock"),
          }
          Path("model/requirements.lock.meta.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit generated locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json model/requirements.lock model/requirements.lock.meta.json
          if git diff --cached --quiet; then
            echo "Dependency locks are already current."
            exit 0
          fi
          git commit -m "chore(deps): refresh reproducible dependency locks"
          git push origin HEAD:"${GITHUB_REF_NAME}"
