name: Train real-world CRIX model

on:
  workflow_dispatch:
  push:
    branches:
      - feat/crix-real-world-v3
    paths:
      - model/datasets.py
      - model/train.py
      - model/benchmark_external.py
      - model/requirements.txt
      - .github/workflows/train-real-world-model.yml

permissions:
  contents: write

concurrency:
  group: crix-real-world-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Restore immutable LendingClub source cache
        uses: actions/cache@v4
        with:
          path: model/data/LC_loans_granting_model_dataset.csv
          key: crix-lendingclub-b019384d6bc65bf2a3e839362e4ff502
      - name: Install training dependencies
        run: pip install -r model/requirements.txt
      - name: Train and validate real-data champion/challenger
        run: python model/train.py
      - name: Run external real-world adaptation benchmarks
        run: python model/benchmark_external.py
      - name: Commit immutable trained artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            model/artifacts/crix-monoboost-v2.json \
            model/artifacts/crix-behavior-tw-v1.json \
            model/artifacts/external-benchmarks.json \
            model/TRAINING_REPORT.md \
            model/EXTERNAL_BENCHMARKS.md
          if git diff --cached --quiet; then
            echo "Training reproduced the committed artifacts; nothing to commit."
            exit 0
          fi
          git commit -m "chore(model): publish CRIX real-world artifacts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
