name: Train real-world CRIX model

on:
  workflow_dispatch:
  push:
    branches:
      - feat/crix-real-world-v3
    paths:
      - model/datasets.py
      - model/train.py
      - model/requirements.txt
      - .github/workflows/train-real-world-model.yml

permissions:
  contents: write

concurrency:
  group: crix-real-world-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Install training dependencies
        run: pip install -r model/requirements.txt
      - name: Train and validate real-data champion/challenger
        run: python model/train.py
      - name: Commit immutable trained artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/artifacts/crix-monoboost-v2.json model/TRAINING_REPORT.md
          if git diff --cached --quiet; then
            echo "Training reproduced the committed artifact; nothing to commit."
            exit 0
          fi
          git commit -m "chore(model): publish real-world CRIX v2 artifact"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
